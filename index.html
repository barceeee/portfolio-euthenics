<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Immersion Portfolio</title>
  <meta name="description" content="Work Immersion digital portfolio of a 4th-year BSIT student: profile, résumé, skills, achievements, projects, HTE evaluation, reflection and contact.">
  <meta name="theme-color" content="#09090b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Work Immersion Portfolio">
  <meta property="og:url" content="">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/intro.css">
  <link rel="stylesheet" href="/assets/css/immersion.css">
  <script>
    // Decide before first paint whether the opening animation plays (once per visit, never with reduced motion).
    (function () {
      try {
        if (location.search.indexOf("nointro") > -1) return;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        if (sessionStorage.getItem("introSeen")) return;
        document.documentElement.classList.add("intro-play");
      } catch (e) { /* storage blocked: skip the intro */ }
    })();
  </script>
  <script src="/assets/js/intro.js" defer></script>
  <script type="module" src="/assets/js/home.js"></script>
</head>
<body>
  <div id="intro" class="intro-screen" aria-hidden="true">
    <div class="intro-screen__logo">
      <span class="intro-screen__word" data-intro-word="MATT">MATT</span>
      <span class="intro-screen__streaks"></span>
    </div>
    <span class="intro-screen__skip">Click or press any key to skip</span>
  </div>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav">
    <a class="nav__brand" href="/" data-brand>Portfolio</a>
    <nav aria-label="Sections"><ul class="nav__links"></ul></nav>
  </header>

  <main id="main" tabindex="-1">
    <p class="state">Loading…</p>
  </main>

  <dialog id="details" class="dialog"></dialog>
  <footer class="footer"></footer>
  <noscript><p class="state">This portfolio needs JavaScript to load its entries.</p></noscript>
</body>
</html>
